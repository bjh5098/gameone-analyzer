<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타자 분석 - D-Dogs OB</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="index.html" class="brand">D-Dogs OB Stats</a>
      <a href="index.html">홈</a>
      <a href="batter.html" class="active">타자 분석</a>
      <a href="pitcher.html">투수 분석</a>
    </nav>
  </header>

  <section class="hero">
    <h1>타자 분석</h1>
    <p class="lede">한양대학교 D-Dogs OB 선수들의 상황별 타격 스탯을 조회합니다.</p>
  </section>

  <form id="filterForm">
    <fieldset>
      <legend>시즌</legend>
      <label><input type="checkbox" name="season" value="2024" /> 2024</label>
      <label><input type="checkbox" name="season" value="2025" /> 2025</label>
      <label><input type="checkbox" name="season" value="2026" /> 2026</label>
    </fieldset>

    <fieldset>
      <legend>아웃카운트</legend>
      <label><input type="checkbox" name="outs" value="0" /> 무사</label>
      <label><input type="checkbox" name="outs" value="1" /> 1사</label>
      <label><input type="checkbox" name="outs" value="2" /> 2사</label>
    </fieldset>

    <fieldset>
      <legend>주자상황</legend>
      <label><input type="checkbox" name="runnerState" value="empty" /> 주자없음</label>
      <label><input type="checkbox" name="runnerState" value="1" /> 1루</label>
      <label><input type="checkbox" name="runnerState" value="2" /> 2루</label>
      <label><input type="checkbox" name="runnerState" value="3" /> 3루</label>
      <label><input type="checkbox" name="runnerState" value="12" /> 1·2루</label>
      <label><input type="checkbox" name="runnerState" value="13" /> 1·3루</label>
      <label><input type="checkbox" name="runnerState" value="23" /> 2·3루</label>
      <label><input type="checkbox" name="runnerState" value="123" /> 만루</label>
      <label><input type="checkbox" name="rispOnly" /> 득점권만</label>
    </fieldset>

    <fieldset>
      <legend>리그</legend>
      <div id="leagueCheckboxes"></div>
    </fieldset>

    <fieldset>
      <legend>구장 그룹</legend>
      <select name="venueGroup" id="venueGroupSelect">
        <option value="">전체</option>
      </select>
    </fieldset>

    <button type="submit">필터 적용</button>
  </form>

  <h2>팀 전체 스탯</h2>
  <div id="teamStats"></div>

  <h2>선수별 스탯</h2>
  <div class="stat-controls">
    <label for="minPaInput">최소 PA</label>
    <input type="number" id="minPaInput" min="0" step="1" value="0" style="width: 4rem;" />
    <span>(허수 방지용 — 이 값 이상인 선수만 표시 · 컬럼 헤더 클릭 시 정렬)</span>
  </div>
  <div class="table-wrap">
    <table id="playerStatsTable">
      <thead>
        <tr>
          <th data-sort-key="name">선수</th>
          <th data-sort-key="AVG">AVG</th>
          <th data-sort-key="PA">PA</th>
          <th data-sort-key="AB">AB</th>
          <th data-sort-key="H">H</th>
          <th data-sort-key="1B">1B</th>
          <th data-sort-key="2B">2B</th>
          <th data-sort-key="3B">3B</th>
          <th data-sort-key="HR">HR</th>
          <th data-sort-key="TB">TB</th>
          <th data-sort-key="SAC">희타</th>
          <th data-sort-key="SF">희비</th>
          <th data-sort-key="BB">BB</th>
          <th data-sort-key="IBB">고의4구</th>
          <th data-sort-key="HBP">HBP</th>
          <th data-sort-key="SO">SO</th>
          <th data-sort-key="GIDP">병살</th>
          <th data-sort-key="SLG">SLG</th>
          <th data-sort-key="OBP">OBP</th>
          <th data-sort-key="OPS">OPS</th>
          <th data-sort-key="BB_K">BB/K</th>
          <th data-sort-key="XBH_H">장타/안타</th>
          <th data-sort-key="K_RATE">K%</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script type="module">
    import { buildFilterState, matchesFilter } from "./js/filters.js";
    import { loadJSON } from "./js/data-loader.js";
    import { computeBatterStats, groupByPlayer } from "./js/batter-page.js";
    import { sortEntries, nextSortState } from "./js/table-sort.js";
    import { groupLeaguesForCheckboxes } from "./js/league-label.js";

    let allRecords = [];
    let sortState = { key: "PA", direction: "desc" };

    function renderTeamStats(stats) {
      const el = document.getElementById("teamStats");
      el.innerHTML = `
        <p>PA: ${stats.PA} / AB: ${stats.AB} / H: ${stats.H} / 1B: ${stats["1B"]} / 2B: ${stats["2B"]} / 3B: ${stats["3B"]} / HR: ${stats.HR} / TB: ${stats.TB}</p>
        <p>희타: ${stats.SAC} / 희비: ${stats.SF} / BB: ${stats.BB} / 고의4구: ${stats.IBB} / HBP: ${stats.HBP} / SO: ${stats.SO} / 병살: ${stats.GIDP}</p>
        <p>AVG: ${stats.AVG.toFixed(3)} / OBP: ${stats.OBP.toFixed(3)} / SLG: ${stats.SLG.toFixed(3)} / OPS: ${stats.OPS.toFixed(3)}</p>
      `;
    }

    function updateSortIndicators() {
      const headers = document.querySelectorAll("#playerStatsTable th[data-sort-key]");
      for (const th of headers) {
        th.classList.remove("sorted-asc", "sorted-desc");
        if (th.dataset.sortKey === sortState.key) {
          th.classList.add(sortState.direction === "asc" ? "sorted-asc" : "sorted-desc");
        }
      }
    }

    function renderPlayerTable(byPlayer, minPa) {
      const tbody = document.querySelector("#playerStatsTable tbody");
      tbody.innerHTML = "";
      const filtered = Array.from(byPlayer.entries()).filter(([, stats]) => stats.PA >= minPa);
      const sorted = sortEntries(filtered, sortState.key, sortState.direction);
      updateSortIndicators();
      for (const [name, stats] of sorted) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${name}</td><td>${stats.AVG.toFixed(3)}</td><td>${stats.PA}</td><td>${stats.AB}</td><td>${stats.H}</td>
          <td>${stats["1B"]}</td><td>${stats["2B"]}</td><td>${stats["3B"]}</td><td>${stats.HR}</td><td>${stats.TB}</td>
          <td>${stats.SAC}</td><td>${stats.SF}</td>
          <td>${stats.BB}</td><td>${stats.IBB}</td><td>${stats.HBP}</td><td>${stats.SO}</td><td>${stats.GIDP}</td>
          <td>${stats.SLG.toFixed(3)}</td><td>${stats.OBP.toFixed(3)}</td>
          <td>${stats.OPS.toFixed(3)}</td><td>${stats.BB_K.toFixed(2)}</td><td>${stats.XBH_H.toFixed(3)}</td>
          <td>${(stats.K_RATE * 100).toFixed(1)}%</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function populateLeagueCheckboxes(records) {
      const leagues = Array.from(new Set(records.map((r) => r.league))).sort();
      const groups = groupLeaguesForCheckboxes(leagues);
      const container = document.getElementById("leagueCheckboxes");
      container.innerHTML = "";
      for (const group of groups) {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.name = "league";
        input.value = JSON.stringify(group.members);
        label.appendChild(input);
        label.appendChild(document.createTextNode(` ${group.label}`));
        container.appendChild(label);
      }
    }

    function populateVenueGroups(records) {
      const venues = Array.from(new Set(records.map((r) => r.venue.replace(/\s+/g, "")))).sort();
      const select = document.getElementById("venueGroupSelect");
      for (const v of venues) {
        const option = document.createElement("option");
        option.value = JSON.stringify([v]);
        option.textContent = v;
        select.appendChild(option);
      }
    }

    function applyFilterAndRender() {
      const form = document.getElementById("filterForm");
      const filterState = buildFilterState(form);
      const filtered = allRecords.filter((r) => matchesFilter(r, filterState));
      const minPa = parseInt(document.getElementById("minPaInput").value, 10) || 0;
      renderTeamStats(computeBatterStats(filtered));
      renderPlayerTable(groupByPlayer(filtered), minPa);
    }

    async function init() {
      allRecords = await loadJSON("data_batter.json");
      populateLeagueCheckboxes(allRecords);
      populateVenueGroups(allRecords);
      applyFilterAndRender();

      document.getElementById("filterForm").addEventListener("submit", (e) => {
        e.preventDefault();
        applyFilterAndRender();
      });
      document.getElementById("minPaInput").addEventListener("input", applyFilterAndRender);

      document.querySelectorAll("#playerStatsTable th[data-sort-key]").forEach((th) => {
        th.addEventListener("click", () => {
          sortState = nextSortState(sortState, th.dataset.sortKey);
          applyFilterAndRender();
        });
      });
    }

    init();
  </script>
</body>
</html>
